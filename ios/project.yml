# Штаб для iPhone — нативная оболочка вокруг https://stefannious.github.io/shtab/
# Проект Xcode (Shtab.xcodeproj) собирается из этого файла командой `xcodegen generate` (это делает GitHub Actions).
name: Shtab
options:
  bundleIdPrefix: com.stefannious
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ru
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Shtab:
    type: application
    platform: iOS
    sources:
      - path: Shtab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stefannious.shtab
        PRODUCT_NAME: Shtab
        INFOPLIST_FILE: Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
schemes:
  Shtab:
    build:
      targets:
        Shtab: all
    run:
      config: Debug
    archive:
      config: Release
