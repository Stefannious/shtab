name: Напоминания
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remind
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: push
      - run: node push/remind.mjs
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          DATA_REPO: ${{ vars.DATA_REPO }}
