<body>
<title>Штаб Анри</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@200;300;400;500;600;700;800&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme: light;
  --bg:#F4EEE4; --bg2:#EBE3D6; --panel:#FFFDF9; --panel2:#F8F3EA;
  --line:rgba(60,44,28,.10); --line2:rgba(60,44,28,.18);
  --text:#1F1A15; --text2:#5E554B; --muted:#978C7F;
  --acc:#1F1A15; --acc-rgb:31,26,21; --acc-ink:#FFFDF9;
  --gold:#B8925A; --gold-soft:#E9D8BC;
  --good:#4E7A58; --warn:#A8702F; --bad:#B04A3F;
  --shadow:0 1px 2px rgba(60,44,28,.05), 0 10px 28px rgba(60,44,28,.07);
  --f-disp:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --tabbar-h:66px;
}
:root[data-accent="bronze"]{ --acc:#86653B; --acc-rgb:134,101,59; --acc-ink:#FFFDF9; }
:root[data-accent="olive"]{ --acc:#55613F; --acc-rgb:85,97,63; --acc-ink:#FFFDF9; }
:root[data-accent="wine"]{ --acc:#7A2E33; --acc-rgb:122,46,51; --acc-ink:#FFFDF9; }

html,body{height:100%}
body{background:var(--bg); color:var(--text); font:15px/1.5 var(--f-body); -webkit-font-smoothing:antialiased; overflow-x:hidden}
body::before{content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 520px at 50% -140px, rgba(var(--acc-rgb),.10), transparent 70%),
    linear-gradient(rgba(var(--acc-rgb),.028) 1px, transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg, rgba(var(--acc-rgb),.028) 1px, transparent 1px) 0 0/32px 32px;}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.dim{color:var(--text2)}
.num{font-variant-numeric:tabular-nums}
.ico{width:20px; height:20px; flex:none; display:block}
.ico.sm{width:16px; height:16px}

/* ---------- shell ---------- */
.app{position:relative; z-index:1; display:flex; min-height:100%}
.rail{display:none}
.main{flex:1; min-width:0; padding-inline:16px; padding-block:10px calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1180px; margin-inline:auto}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:8px 6px}
.hello{min-width:0}
.hello h1{font:500 17px/1.25 var(--f-disp); margin:0; letter-spacing:-.01em; text-wrap:balance}
.hello .date{font:500 10.5px/1.4 var(--f-mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-top:3px}
.tb-right{display:flex; align-items:center; gap:8px; flex:none}
.lvl-chip{position:relative; display:flex; align-items:center; gap:8px; height:34px; padding:0 10px 0 6px; border:1px solid var(--line2); border-radius:17px; background:var(--panel); font:500 12px var(--f-mono)}
.lvl-chip .rk{display:grid; place-items:center; width:24px; height:24px; border-radius:50%; background:rgba(var(--acc-rgb),.15); color:var(--acc); font:700 12px var(--f-disp)}
.lvl-chip .bar{width:44px; height:3px; background:var(--line2); border-radius:2px; overflow:hidden}
.lvl-chip .bar i{display:block; height:100%; background:var(--acc)}
.xp-pop{position:absolute; right:6px; top:-4px; font:700 12px var(--f-mono); color:var(--acc); pointer-events:none; animation:xpup 1.4s ease-out forwards}
@keyframes xpup{0%{opacity:0; transform:translateY(6px)}15%{opacity:1}100%{opacity:0; transform:translateY(-22px)}}
.sync{width:8px; height:8px; border-radius:50%; background:var(--muted)}
.sync.live{background:var(--good); box-shadow:0 0 8px rgba(78,122,88,.6)}
.sync.local{background:var(--warn)}
.icon-btn{display:grid; place-items:center; width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text2)}
.icon-btn:hover{color:var(--text); border-color:var(--line2)}
.banner{margin:6px 0 4px; padding:10px 12px; border:1px solid rgba(168,112,47,.35); background:rgba(168,112,47,.07); border-radius:8px; font-size:13px; color:var(--text2)}

.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; display:grid; grid-template-columns:repeat(5,1fr); height:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px)); padding-bottom:env(safe-area-inset-bottom,0px); background:rgba(255,253,249,.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line)}
.tab{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--muted); font:500 10.5px var(--f-body)}
.tab.on{color:var(--acc)}
.tab.on .ico{filter:drop-shadow(0 0 6px rgba(var(--acc-rgb),.7))}

@media (min-width:900px){
  .rail{display:flex; flex-direction:column; gap:4px; width:212px; flex:none; position:sticky; top:0; height:100vh; padding:22px 14px; border-right:1px solid var(--line); background:rgba(255,253,249,.55)}
  .brand{display:flex; align-items:center; gap:10px; padding:4px 10px 22px; font:700 13px var(--f-disp); letter-spacing:.14em}
  .brand i{width:12px; height:12px; border-radius:50%; background:var(--acc); box-shadow:0 0 12px var(--acc)}
  .rail .tab{flex-direction:row; justify-content:flex-start; gap:12px; height:42px; padding-inline:12px; border-radius:8px; font-size:14px; color:var(--text2)}
  .rail .tab:hover{background:var(--panel); color:var(--text)}
  .rail .tab.on{background:rgba(var(--acc-rgb),.09); color:var(--acc)}
  .rail-foot{margin-top:auto; padding:10px 12px; font:500 10.5px var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px}
  .tabbar{display:none}
  .main{padding-inline:32px; padding-block:18px 48px}
  .hello h1{font-size:21px}
}

/* ---------- hero / core ---------- */
.hero{display:grid; gap:14px; padding-block:6px 4px}
.core-wrap{display:flex; flex-direction:column; align-items:center; gap:6px}
.core{position:relative; width:min(58vw,236px); aspect-ratio:1; max-width:100%; border-radius:50%; -webkit-tap-highlight-color:transparent}
.core svg{width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 16px rgba(var(--acc-rgb),.32))}
.core .r{transform-box:view-box; transform-origin:50% 50%; animation:spin var(--d,20s) linear infinite}
.core .r.rev{animation-direction:reverse}
.core .pulse{transform-box:view-box; transform-origin:50% 50%; animation:pulse 3.2s ease-in-out infinite}
.core:hover svg{filter:drop-shadow(0 0 22px rgba(var(--acc-rgb),.5))}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.78; transform:scale(1)}50%{opacity:1; transform:scale(1.07)}}
.core-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none}
.core-center b{font:700 26px/1 var(--f-disp); color:#fff; text-shadow:0 0 14px rgba(var(--acc-rgb),.9); font-variant-numeric:tabular-nums}
.core-center i{font:500 9.5px var(--f-mono); letter-spacing:.2em; color:var(--acc); font-style:normal; margin-top:6px; text-transform:uppercase}
.core-name{font:500 11px var(--f-mono); letter-spacing:.32em; color:var(--text2)}
.core.thinking .core-center b{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.core .r,.core .pulse{animation:none}}

.console{display:flex; flex-direction:column; gap:10px; min-width:0}
.summary{margin:0; font-size:14px; color:var(--text2); text-align:center; text-wrap:balance}
.summary b{color:var(--text); font-weight:600}
.log{display:flex; flex-direction:column; gap:10px; max-height:320px; overflow-y:auto; padding:2px 2px 2px 0; scroll-behavior:smooth}
.log:empty{display:none}
.msg{font-size:14.5px; line-height:1.55; max-width:100%; overflow-wrap:anywhere}
.msg .who{display:block; font:500 10px var(--f-mono); letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:3px}
.msg.ai .who{color:var(--acc)}
.msg.user{align-self:flex-end; max-width:86%; background:var(--panel2); border:1px solid var(--line); border-radius:12px 12px 3px 12px; padding:8px 12px}
.msg.user .who{display:none}
.msg.ai{padding:2px 0}
.msg.ai p{margin:0 0 6px}
.msg.ai p:last-child{margin-bottom:0}
.msg.ai ul{margin:4px 0 6px; padding-left:18px}
.msg .note{display:block; margin-top:4px; font:500 11px var(--f-mono); color:var(--warn)}
.typing{display:inline-flex; gap:4px; align-items:center; height:18px}
.typing i{width:5px; height:5px; border-radius:50%; background:var(--acc); animation:dots 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,80%,100%{opacity:.25; transform:scale(.8)}40%{opacity:1; transform:scale(1)}}
.ask{display:flex; gap:8px}
.ask .inp{flex:1; min-width:0}
.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; height:32px; padding:0 12px; border:1px solid var(--line2); border-radius:16px; background:var(--panel); color:var(--text2); font-size:13px; white-space:nowrap}
.chip:hover{color:var(--text); border-color:rgba(var(--acc-rgb),.5)}
.chip:disabled{opacity:.45; cursor:default}
.ai-off{font-size:13px; color:var(--muted); text-align:center}

@media (min-width:900px){
  .hero{grid-template-columns:300px minmax(0,1fr); align-items:center; gap:36px; padding-block:14px 8px}
  .core{width:280px}
  .summary{text-align:left}
  .log{max-height:340px}
}

/* ---------- common blocks ---------- */
.page-h{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding-block:14px 4px; flex-wrap:wrap}
.page-h h1{font:500 22px/1.2 var(--f-disp); margin:0; letter-spacing:-.01em}
.page-h p{margin:4px 0 0; color:var(--text2); font-size:13.5px}
.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:24px 0 10px}
.sec-h h2{margin:0; font:500 11px var(--f-mono); letter-spacing:.18em; text-transform:uppercase; color:var(--text2)}
.sec-h .aside{font:500 11px var(--f-mono); color:var(--muted); letter-spacing:.06em}
.hud{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:4px}
.hud::before,.hud::after{content:""; position:absolute; width:9px; height:9px; pointer-events:none; opacity:.75}
.hud::before{top:-1px; left:-1px; border-top:1px solid var(--acc); border-left:1px solid var(--acc)}
.hud::after{bottom:-1px; right:-1px; border-bottom:1px solid var(--acc); border-right:1px solid var(--acc)}
.pad{padding:14px}
.list{display:flex; flex-direction:column}
.row{display:flex; align-items:center; gap:12px; padding:11px 12px; border-top:1px solid var(--line); min-height:54px}
.row:first-child{border-top:0}
.row .main-t{flex:1; min-width:0; text-align:left}
.row .ttl{display:block; font-size:14.5px; line-height:1.35; overflow-wrap:anywhere}
.row .sub{display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:3px; font-size:12px; color:var(--muted)}
.row.done .ttl{color:var(--muted); text-decoration:line-through; text-decoration-color:rgba(60,44,28,.35)}
.row .time{flex:none; width:44px; font:500 12px var(--f-mono); color:var(--text2)}
.row .time.none{color:var(--muted)}
.row .kind{flex:none; font:500 9.5px var(--f-mono); letter-spacing:.14em; color:var(--muted); text-transform:uppercase}
.empty{padding:22px 14px; text-align:center; color:var(--muted); font-size:13.5px}
.chk{flex:none; display:grid; place-items:center; width:28px; height:28px; border:1.5px solid var(--line2); border-radius:7px; color:transparent; transition:background .15s,border-color .15s}
.chk:hover{border-color:rgba(var(--acc-rgb),.7)}
.chk.on{background:var(--acc); border-color:var(--acc); color:var(--acc-ink); box-shadow:0 0 12px rgba(var(--acc-rgb),.45)}
.chk.bad.on{background:var(--bad); border-color:var(--bad); color:#FFFDF9; box-shadow:none}
.chk .ico{width:16px; height:16px; stroke-width:2.6}
.tag{display:inline-flex; align-items:center; height:19px; padding:0 7px; border-radius:10px; font:500 10.5px var(--f-mono); letter-spacing:.04em; border:1px solid var(--line2); color:var(--text2); white-space:nowrap}
.tag.acc{border-color:rgba(var(--acc-rgb),.45); color:var(--acc)}
.tag.warn{border-color:rgba(168,112,47,.45); color:var(--warn)}
.tag.bad{border-color:rgba(176,74,63,.45); color:var(--bad)}
.tag.good{border-color:rgba(78,122,88,.45); color:var(--good)}
.tag.ex{border-style:dashed; color:var(--muted)}
.prio{font:700 12px var(--f-mono); letter-spacing:-.05em}
.prio.p1{color:var(--text2)} .prio.p2{color:var(--warn)} .prio.p3{color:var(--bad)}
.flame{display:inline-flex; align-items:center; gap:3px; font:500 12px var(--f-mono); color:var(--warn)}
.flame .ico{width:13px; height:13px}
.flame.zero{color:var(--muted)}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; height:38px; padding:0 14px; border:1px solid var(--line2); border-radius:8px; background:var(--panel2); color:var(--text); font:500 13.5px var(--f-body); white-space:nowrap}
.btn:hover{border-color:rgba(var(--acc-rgb),.55)}
.btn.pri{background:var(--acc); border-color:var(--acc); color:var(--acc-ink); font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad); border-color:rgba(176,74,63,.35); background:transparent}
.btn.danger.armed{background:var(--bad); color:#FFFDF9; border-color:var(--bad)}
.btn.sm{height:30px; padding:0 10px; font-size:12.5px; border-radius:7px}
.btn.icon{width:38px; padding:0}
.btn.sm.icon{width:30px}
.btn:disabled{opacity:.45; cursor:default}
.btns{display:flex; flex-wrap:wrap; gap:8px}

.inp{height:42px; width:100%; min-width:0; background:var(--bg2); border:1px solid var(--line2); border-radius:8px; padding:0 12px; font-size:16px; color:var(--text)}
textarea.inp{height:auto; padding:10px 12px; resize:vertical; line-height:1.45}
.inp::placeholder{color:var(--muted)}
.inp:focus{outline:none; border-color:rgba(var(--acc-rgb),.7); box-shadow:0 0 0 3px rgba(var(--acc-rgb),.12)}
select.inp{appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px; background-size:5px 5px; background-repeat:no-repeat; padding-right:30px}
.seg{display:inline-flex; flex-wrap:wrap; border:1px solid var(--line2); border-radius:8px; overflow:hidden}
.seg button{height:36px; padding:0 12px; font-size:13px; color:var(--text2); border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:rgba(var(--acc-rgb),.15); color:var(--acc)}
.days{display:flex; gap:6px; flex-wrap:wrap}
.days button{width:40px; height:34px; border-radius:7px; border:1px solid var(--line2); font:500 12px var(--f-mono); color:var(--text2)}
.days button.on{background:rgba(var(--acc-rgb),.15); border-color:rgba(var(--acc-rgb),.6); color:var(--acc)}
.fld{display:flex; flex-direction:column; gap:6px; min-width:0}
.fld > span{font:500 10.5px var(--f-mono); letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.fld small{color:var(--muted); font-size:12px}
.form{display:flex; flex-direction:column; gap:14px}
.g2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.g3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.icons{display:flex; flex-wrap:wrap; gap:6px}
.icons button{width:40px; height:40px; border-radius:8px; border:1px solid var(--line); font-size:20px}
.icons button.on{border-color:var(--acc); background:rgba(var(--acc-rgb),.12)}
.switch{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:8px}
.switch input{width:20px; height:20px; accent-color:var(--acc)}

/* ---------- tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:18px}
.tile{position:relative; display:flex; flex-direction:column; gap:4px; padding:13px 13px 12px; min-height:142px; overflow:hidden}
.tile-hit{position:absolute; inset:0; z-index:0; border-radius:4px}
.tile-hit:hover{background:rgba(var(--acc-rgb),.035)}
.t-lbl{display:flex; align-items:center; gap:6px; font:500 10px var(--f-mono); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); pointer-events:none}
.t-lbl .ico{width:14px; height:14px; color:var(--acc)}
.t-val{font:500 25px/1.15 var(--f-disp); letter-spacing:-.02em; pointer-events:none; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.t-val small{font-size:15px; color:var(--muted); font-weight:400}
.t-val.txt{font-size:16px; line-height:1.25; font-weight:500}
.t-sub{font-size:12.5px; color:var(--text2); line-height:1.35; pointer-events:none; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.t-act{position:relative; z-index:1; margin-top:auto; padding-top:8px; display:flex; gap:6px}
.t-act .btn{flex:1; min-width:0}
.t-act .btn span{overflow:hidden; text-overflow:ellipsis}
.meter{height:3px; background:var(--line2); border-radius:2px; overflow:hidden; margin-top:6px; pointer-events:none}
.meter i{display:block; height:100%; background:var(--acc); border-radius:2px}
@media (min-width:700px){ .tiles{grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px} }

/* ---------- tasks ---------- */
.week{display:flex; align-items:center; gap:6px; margin-top:12px}
.week-days{flex:1; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px}
.wd{position:relative; display:flex; flex-direction:column; align-items:center; gap:1px; padding:7px 0 9px; border-radius:8px; border:1px solid transparent; color:var(--text2)}
.wd b{font:500 16px var(--f-disp)}
.wd span{font:500 10px var(--f-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.wd.today b{color:var(--acc)}
.wd.sel{background:var(--panel2); border-color:rgba(var(--acc-rgb),.55)}
.wd .dot{position:absolute; bottom:4px; width:4px; height:4px; border-radius:50%; background:var(--acc)}
.wd .dot.all{background:var(--muted)}
.addbar{display:flex; gap:8px; margin-top:14px}
.addbar .inp{flex:1}
.addbar .t-in{flex:none; width:108px}
.overdue{margin-top:14px; border-color:rgba(176,74,63,.3)}
.overdue-h{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; font-size:13px; color:var(--bad); border-bottom:1px solid var(--line)}

/* ---------- habits ---------- */
.h-ico{flex:none; display:grid; place-items:center; width:38px; height:38px; border-radius:10px; background:var(--panel2); font-size:19px}
.stepper{flex:none; display:flex; align-items:center; gap:4px}
.stepper .v{min-width:56px; text-align:center; font:500 13px var(--f-mono)}
.stepper .v.ok{color:var(--acc)}
.dots7{display:flex; gap:3px}
.dots7 i{width:7px; height:7px; border-radius:2px; background:var(--line2)}
.dots7 i.d{background:var(--acc)}
.dots7 i.m{background:rgba(176,74,63,.55)}
.dots7 i.n{background:transparent; border:1px solid var(--line)}
.dots7 i.s{background:var(--muted)}
.hm-wrap{overflow-x:auto}
.legend{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font:500 10.5px var(--f-mono); color:var(--muted); margin-top:8px}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px}

/* ---------- gym ---------- */
.today-card{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; padding:16px; margin-top:14px}
.today-card h3{margin:2px 0 0; font:500 19px/1.25 var(--f-disp)}
.today-card .t-lbl{pointer-events:auto}
.ex-card{padding:12px 12px 10px; margin-top:10px}
.ex-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
.ex-head h4{margin:0; font-size:15.5px; font-weight:600}
.ex-head .last{font:500 11.5px var(--f-mono); color:var(--muted); margin-top:3px}
.sets{width:100%; border-collapse:collapse; margin-top:8px}
.sets th{font:500 10px var(--f-mono); letter-spacing:.14em; color:var(--muted); text-transform:uppercase; text-align:left; padding:4px 4px 6px}
.sets td{padding:3px 4px}
.sets td:first-child{width:28px; font:500 12px var(--f-mono); color:var(--muted)}
.sets .inp{height:38px; padding:0 8px; font-family:var(--f-mono); text-align:center}
.sets tr.done .inp{border-color:rgba(var(--acc-rgb),.35); color:var(--acc)}
.sets td.c{width:40px; text-align:right}
.sets td.x{width:34px}
.wo-bar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:14px 16px; margin-top:14px}
.wo-bar .clock{font:500 22px var(--f-mono); color:var(--acc); font-variant-numeric:tabular-nums}
.rest{position:fixed; left:12px; right:12px; bottom:calc(var(--tabbar-h) + 10px + env(safe-area-inset-bottom,0px)); z-index:35; display:flex; align-items:center; gap:10px; padding:10px 12px; background:rgba(10,21,32,.97); border:1px solid rgba(var(--acc-rgb),.5); border-radius:10px; box-shadow:0 0 24px rgba(var(--acc-rgb),.18)}
.rest .t{font:700 20px var(--f-mono); color:var(--acc); min-width:64px; font-variant-numeric:tabular-nums}
.rest .track{flex:1; height:4px; background:var(--line2); border-radius:2px; overflow:hidden}
.rest .track i{display:block; height:100%; background:var(--acc)}
@media (min-width:900px){ .rest{left:auto; right:32px; bottom:24px; width:420px} }
.mus{display:grid; grid-template-columns:78px minmax(0,1fr) 92px; align-items:center; gap:10px; padding:7px 12px; font-size:13px}
.mus .trk{position:relative; height:8px; background:var(--bg2); border-radius:4px; overflow:hidden}
.mus .band{position:absolute; top:0; bottom:0; background:rgba(var(--acc-rgb),.10); border-left:1px dashed rgba(var(--acc-rgb),.45); border-right:1px dashed rgba(var(--acc-rgb),.45)}
.mus .fill{position:absolute; left:0; top:1px; bottom:1px; background:var(--acc); border-radius:0 4px 4px 0}
.mus .st{font:500 11px var(--f-mono); text-align:right; white-space:nowrap}
.lib-g{margin-top:12px}
.lib-g h5{margin:0 0 6px; font:500 10.5px var(--f-mono); letter-spacing:.14em; color:var(--muted); text-transform:uppercase}
.lib{display:flex; flex-wrap:wrap; gap:6px}
.pd-ex{display:grid; grid-template-columns:minmax(0,1fr) 108px 54px 70px 32px; gap:6px; align-items:center}
.pd-ex .inp{height:38px; font-size:14px; padding:0 8px}
@media (max-width:560px){ .pd-ex{grid-template-columns:minmax(0,1fr) 54px 64px 32px} .pd-ex .mus-sel{grid-column:1 / -1; grid-row:2} .pd-ex{padding-bottom:8px; border-bottom:1px solid var(--line)} }

/* ---------- progress ---------- */
.lvl-card{display:grid; grid-template-columns:auto minmax(0,1fr); gap:18px; align-items:center; padding:18px; margin-top:14px}
.hex{position:relative; width:84px; height:94px}
.hex svg{width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 12px rgba(var(--acc-rgb),.4))}
.hex b{position:absolute; inset:0; display:grid; place-items:center; font:700 34px var(--f-disp); color:var(--acc)}
.lvl-card h3{margin:0; font:500 19px/1.2 var(--f-disp)}
.lvl-card .xpbar{height:6px; background:var(--line2); border-radius:3px; overflow:hidden; margin:10px 0 6px}
.lvl-card .xpbar i{display:block; height:100%; background:linear-gradient(90deg, rgba(var(--acc-rgb),.55), var(--acc)); border-radius:3px}
.stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:10px}
.stat{padding:12px 13px}
.stat .t-val{font-size:22px}
@media (min-width:700px){ .stats{grid-template-columns:repeat(4,minmax(0,1fr))} }
.charts{display:grid; grid-template-columns:minmax(0,1fr); gap:12px}
@media (min-width:900px){ .charts.two{grid-template-columns:repeat(2,minmax(0,1fr))} }
.chart-card{padding:14px 12px 10px}
.chart-card h3{margin:0 0 2px; font:500 11px var(--f-mono); letter-spacing:.16em; text-transform:uppercase; color:var(--text2)}
.chart-card .cap{font-size:12.5px; color:var(--muted); margin:0 0 8px}
.chart{width:100%; min-height:40px}
.chart svg{display:block; overflow:visible}
.chart text{font-family:var(--f-mono); font-size:10.5px; fill:var(--muted)}
.chart text.val{fill:var(--text); font-size:11.5px; font-weight:500}
.insights{display:flex; flex-direction:column}
.ins{display:flex; gap:10px; align-items:flex-start; padding:11px 12px; border-top:1px solid var(--line); font-size:14px}
.ins:first-child{border-top:0}
.ins .k{flex:none; font:500 10px var(--f-mono); letter-spacing:.14em; color:var(--acc); padding-top:3px; width:62px}
.ach{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.badge{display:flex; gap:10px; align-items:center; padding:10px}
.badge .bx{position:relative; flex:none; width:40px; height:44px}
.badge .bx svg{width:100%; height:100%}
.badge .bx b{position:absolute; inset:0; display:grid; place-items:center; font:700 10.5px var(--f-mono)}
.badge .bt{font-size:13px; font-weight:600; line-height:1.25}
.badge .bd{font-size:11.5px; color:var(--muted); line-height:1.3; margin-top:2px}
.badge.lock{opacity:.5}
.badge.lock .bx b{color:var(--muted)}
.badge.got .bx b{color:var(--acc)}

/* ---------- modal / toast / tooltip ---------- */
.back{position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center; background:rgba(31,26,21,.28); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px)}
.sheet{position:relative; width:100%; max-width:580px; max-height:90dvh; overflow-y:auto; background:var(--bg2); border:1px solid var(--line2); border-bottom:0; border-radius:16px 16px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px)); animation:up .22s ease-out}
.sheet h3{margin:0 0 14px; font:500 18px/1.25 var(--f-disp); padding-right:40px}
.sheet .close{position:absolute; top:12px; right:12px}
@keyframes up{from{transform:translateY(24px); opacity:0}}
@media (min-width:700px){ .back{align-items:center; padding:24px} .sheet{border-radius:12px; border-bottom:1px solid var(--line2); padding:22px 22px} }
.actions{display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; margin-top:4px}
.actions .sp{margin-right:auto}
.toasts{position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top,0px) + 10px); z-index:80; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding-inline:16px}
.toast{max-width:440px; padding:10px 14px; background:rgba(14,28,43,.97); border:1px solid rgba(var(--acc-rgb),.5); border-radius:10px; font-size:13.5px; box-shadow:0 8px 30px rgba(0,0,0,.45), 0 0 18px rgba(var(--acc-rgb),.15); animation:tin .25s ease-out}
.toast b{color:var(--acc); font-weight:600}
.toast.bad{border-color:rgba(176,74,63,.6)}
.toast.big{padding:14px 18px; font-size:15px; text-align:center}
.toast.big b{display:block; font:700 18px var(--f-disp); margin-bottom:2px}
@keyframes tin{from{transform:translateY(-10px); opacity:0}}
.tip{position:fixed; z-index:90; pointer-events:none; padding:6px 9px; background:var(--panel2); border:1px solid var(--line2); border-radius:6px; font:500 11.5px/1.35 var(--f-mono); color:var(--text); white-space:pre; box-shadow:0 6px 20px rgba(0,0,0,.4)}

[hidden]{display:none!important}
.row .sub:empty{display:none}
button.main-t{display:block; cursor:pointer; color:inherit}
.seg.full{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); width:100%}
.seg.full button{border-left:1px solid var(--line)}
.seg.full button:first-child{border-left:0}
.g3 .stat .t-val{font-size:19px}

.sets{table-layout:fixed}
.sets th:nth-child(1){width:30px}
.sets th:nth-child(4){width:40px}
.sets th:nth-child(5){width:36px}
.sets td.c,.sets td.x{text-align:right}
.badge > span:last-child{min-width:0}
.badge .bt{overflow-wrap:anywhere}
@media (max-width:480px){ .row .kind{display:none} .row .time{width:40px} }

a{color:var(--acc)}
a.btn{text-decoration:none; color:var(--text)}
button.row{width:100%; text-align:left}
.tab span{white-space:nowrap}
.fab{position:fixed; right:16px; bottom:calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom,0px)); z-index:25; width:54px; height:54px; border-radius:50%; background:var(--acc); color:var(--acc-ink); display:grid; place-items:center; box-shadow:0 0 22px rgba(var(--acc-rgb),.45), 0 8px 20px rgba(0,0,0,.45)}
.fab .ico{width:26px; height:26px; stroke-width:2.2}
@media (min-width:900px){ .fab{right:32px; bottom:28px} }
.quick{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.qa{display:flex; flex-direction:column; align-items:center; gap:8px; padding:18px 6px; font-size:13.5px}
.qa .ico{width:24px; height:24px; color:var(--acc)}
.kcal-card{display:grid; gap:16px; padding:16px; margin-top:14px}
@media (min-width:760px){ .kcal-card{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); align-items:center; gap:28px} }
.kc-val{margin-top:4px} .kc-val b{font:500 32px/1.1 var(--f-disp)} .kc-val small{color:var(--muted); font-size:14px}
.meter.big{height:6px; margin:10px 0 8px}
.macs{display:grid; gap:12px}
.mac .meter{margin-top:5px}
.mac-h{display:flex; justify-content:space-between; gap:10px; font-size:13px; color:var(--text2)}
.mac-h b{color:var(--text); font-weight:600}
.add-row{justify-content:flex-start; gap:8px; color:var(--acc); font-size:13.5px; min-height:46px}
.cues{margin:0 0 12px; padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:14px; line-height:1.45}
.tech{margin-top:10px; padding:12px; border:1px dashed var(--line2); border-radius:6px; background:var(--bg2)}
.tech .ico.sm:last-child{width:13px; height:13px; opacity:.7}
.kv{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:6px; margin-top:12px; background:var(--panel)}
.kv > div{display:flex; justify-content:space-between; align-items:baseline; gap:14px; padding:9px 12px; border-top:1px solid var(--line); font-size:13.5px}
.kv > div:first-child{border-top:0}
.kv span{color:var(--muted); flex:none} .kv b{font-weight:600; text-align:right; overflow-wrap:anywhere}
.rec{margin-top:8px; font-size:13.5px; line-height:1.45; color:var(--text2)}
.rec b{color:var(--acc); font-weight:600}
.adv{margin-top:8px; padding:8px 10px; border-radius:6px; background:rgba(var(--acc-rgb),.07); border:1px solid rgba(var(--acc-rgb),.28); font-size:13px}
.calc{margin:10px 0 12px; padding-left:18px; display:flex; flex-direction:column; gap:6px; font-size:14px; line-height:1.45}
.calc b{font-weight:600}
.unit{align-self:center; color:var(--muted)}
.food-list{max-height:300px; overflow-y:auto; margin-top:8px}
.sticky-actions{position:sticky; bottom:calc(-18px - env(safe-area-inset-bottom,0px)); background:var(--bg2); padding-block:12px; margin-top:14px; border-top:1px solid var(--line); z-index:2}
@media (min-width:700px){ .sticky-actions{bottom:-22px} }
@media (max-width:380px){ .tab{font-size:9.5px} }

/* ---------- v3 ---------- */
.core{width:min(44vw,176px)}
.hero{grid-template-columns:minmax(0,1fr)}
.now-wrap{display:flex; flex-direction:column; gap:10px; min-width:0}
.now{padding:14px 16px 12px}
.now h3{margin:5px 0 2px; font:500 19px/1.3 var(--f-disp); text-wrap:balance; overflow-wrap:anywhere}
.now p{margin:2px 0 0; font-size:13.5px}
.now > .btns{margin-top:12px}
.next{margin:12px -16px -12px; border-top:1px solid var(--line)}
.nx{display:flex; align-items:center; gap:10px; padding:8px 16px; font-size:13.5px; border-top:1px solid var(--line)}
.nx:first-child{border-top:0}
.nx .chk{width:26px; height:26px}
.nx-t{flex:1; min-width:0; overflow-wrap:anywhere}
.nx .mono{font-size:11.5px}
@media (min-width:900px){ .hero{grid-template-columns:240px minmax(0,1fr); gap:32px} .core{width:236px} }
.core[data-state="behind"]{--acc:var(--warn); --acc-rgb:168,112,47}
.core[data-state="done"] svg{filter:drop-shadow(0 0 26px rgba(var(--acc-rgb),.6))}
.core.flash svg{animation:flash 1.3s ease-out}
@keyframes flash{30%{filter:drop-shadow(0 0 44px rgba(var(--acc-rgb),1)) brightness(1.6)}}
.rings{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:14px}
.rg{display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px 9px; border:1px solid var(--line); border-radius:8px; background:var(--panel)}
.rg:hover{border-color:var(--line2)}
.rg .ring{width:40px; height:40px}
.rg-v{font:500 14px/1.2 var(--f-disp)}
.rg-l{font:500 9.5px var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.daybar{display:flex; align-items:center; gap:10px; width:100%; margin-top:14px; padding:12px 14px; border:1px solid var(--line); border-radius:6px; background:var(--panel); font-size:14px}
.daybar span:first-child{flex:1; text-align:left}
.week-card{margin-top:14px}
.wk{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px 10px; margin:12px 0 14px}
.wk div{display:flex; flex-direction:column; gap:2px; min-width:0}
.wk b{font:500 18px/1.2 var(--f-disp)}
.wk span{font-size:11.5px; color:var(--muted)}
@media (min-width:760px){ .wk{grid-template-columns:repeat(7,minmax(0,1fr))} }
.subnav{display:flex; gap:4px; padding:4px; margin-top:10px; background:var(--panel); border:1px solid var(--line); border-radius:10px}
.subnav button{flex:1; height:36px; border-radius:7px; font-size:14px; color:var(--text2)}
.subnav button.on{background:rgba(var(--acc-rgb),.14); color:var(--acc)}
@media (min-width:900px){ .subnav{display:none} }
.core-tab{position:relative}
.core-tab .mc{display:grid; place-items:center; width:54px; height:54px; margin-top:-20px; border-radius:50%; background:var(--bg2); border:1px solid rgba(var(--acc-rgb),.55); box-shadow:0 0 18px rgba(var(--acc-rgb),.35)}
.core-tab .mc svg{width:40px; height:40px}
.mcr{transform-box:view-box; transform-origin:50% 50%; animation:spin 8s linear infinite}
@media (prefers-reduced-motion:reduce){ .mcr{animation:none} }
.rail-cmd{justify-content:flex-start; margin:0 2px 16px}
.sheet-log{max-height:44vh; margin-bottom:12px}
.sheet-log:empty{display:none}
.ask{align-items:flex-end}
.ask textarea.inp{resize:none; min-height:42px; max-height:140px; padding:9px 12px; line-height:1.4}
.ask label.btn{cursor:pointer}
.receipt{margin-top:8px; padding:10px 12px; border:1px solid rgba(var(--acc-rgb),.35); border-radius:8px; background:rgba(var(--acc-rgb),.06); font-size:13.5px}
.receipt ul{margin:4px 0 10px; padding-left:18px}
.receipt.undone{opacity:.6; border-color:var(--line2); background:none}
.receipt.undone ul{margin-bottom:0; text-decoration:line-through}
.photo-chip{display:flex; align-items:center; gap:10px; margin-top:8px; font-size:13px; color:var(--text2)}
.photo-chip img{width:44px; height:44px; object-fit:cover; border-radius:6px; border:1px solid var(--line2)}
.focus{padding:18px 16px; margin-top:12px; text-align:center}
.focus .t-lbl{justify-content:center}
.f-name{margin:6px 0 14px; font:500 23px/1.25 var(--f-disp); text-wrap:balance}
.f-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.f-cell{display:flex; flex-direction:column; gap:8px; align-items:center; padding:12px 4px; border:1px solid var(--line); border-radius:10px; background:var(--bg2); min-width:0}
.f-cell > span{font:500 10px var(--f-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.f-step{display:flex; align-items:center; gap:6px}
.f-step b{font:500 30px/1 var(--f-disp); min-width:62px}
.f-step .btn.icon{width:40px; height:40px}
.f-go{width:100%; height:58px; font-size:17px; margin:14px 0 10px}
.h-ico{color:var(--acc)}
.h-ico .ico{width:20px; height:20px}
.icons button{display:grid; place-items:center; color:var(--text2)}
.icons button.on{color:var(--acc)}
.dots7 i.f{background:transparent; border:1px solid var(--acc)}

/* ================= premium light ================= */
body{background:var(--bg); color:var(--text); font:15px/1.5 var(--f-body); font-variant-numeric:tabular-nums; letter-spacing:-.005em}
body::before{background:radial-gradient(1100px 620px at 50% -240px, rgba(255,255,255,.95), rgba(255,255,255,0) 70%), radial-gradient(700px 500px at 110% 30%, rgba(233,216,188,.35), transparent 70%)}
::selection{background:var(--gold-soft)}
.hud{background:var(--panel); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow)}
.hud::before,.hud::after{display:none}
.hud.list{overflow:hidden}
.main{padding-inline:18px}
.topbar{padding-block:10px 8px}
.hello h1{font:700 23px/1.2 var(--f-disp); letter-spacing:-.025em}
.hello .date{font:600 11.5px/1.4 var(--f-body); letter-spacing:.08em; color:var(--muted)}
.lvl-chip{background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); font:700 12px var(--f-body); height:36px}
.lvl-chip .rk{background:var(--text); color:var(--panel); font:800 12px var(--f-body)}
.lvl-chip .bar{background:var(--bg2)} .lvl-chip .bar i{background:var(--gold)}
.xp-pop{color:var(--gold); font:800 12px var(--f-body)}
.icon-btn{border-radius:50%; background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); color:var(--text2)}
.sync.live{box-shadow:none}
.banner{border-radius:16px; background:#FBF3E6; border-color:rgba(168,112,47,.25); color:var(--text2)}
/* tab bar + rail */
.tabbar{background:rgba(255,253,249,.86); backdrop-filter:saturate(1.4) blur(22px); -webkit-backdrop-filter:saturate(1.4) blur(22px); border-top:1px solid var(--line)}
.tab{color:var(--muted); font:600 11px var(--f-body); gap:5px}

:root{ --f-serif:'Cormorant Garamond','Cormorant',Georgia,'Times New Roman',serif; --prog:#A9824C; --card-sh:0 1px 0 rgba(255,255,255,.85) inset, 0 1px 2px rgba(60,44,28,.04), 0 14px 34px -10px rgba(60,44,28,.13); }
body{background:linear-gradient(180deg,#F8F3EB 0%, #F2EBDF 55%, #EEE5D7 100%) fixed, #F2EBDF}

body::after{content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.22; mix-blend-mode:multiply;

/* sheet & toasts */
.sheet{background:linear-gradient(180deg,#FAF6EF,#F3ECE1)}
.toast{border-radius:20px; padding:12px 18px}
.toast.big b{font:500 20px var(--f-serif); color:var(--gold-soft)}
.msg.ai .who{font-family:var(--f-serif); font-style:italic; font-size:13px; letter-spacing:.2em}
.qa{border:1px solid rgba(60,44,28,.05); box-shadow:var(--card-sh)}
.qa .ico{width:26px; height:26px; color:var(--prog)}
/* week card */
.week-card .wk b{font:200 30px/1.1 var(--f-body)}
.brand{font:600 18px var(--f-serif); letter-spacing:.32em; font-style:italic}

@media (max-width:480px){ .hello h1{font-size:28px} .topbar{align-items:flex-start} .tb-right{padding-top:4px} }

/* ================= app feel & transitions ================= */
html{-webkit-text-size-adjust:100%; scroll-behavior:auto}
body{overscroll-behavior-y:none; -webkit-tap-highlight-color:transparent}
button,.tab,.chk,.rg,.qa,.daybar,.chip,label.btn{touch-action:manipulation; -webkit-user-select:none; user-select:none}
.chk.pop{animation:pop .32s cubic-bezier(.2,.8,.2,1)}
.topbar{view-transition-name:topbar}
.tabbar{view-transition-name:tabbar}
.rail{view-transition-name:rail}
#view{view-transition-name:page}
#hero{view-transition-name:hero}
#banner{view-transition-name:banner}
:root{--vt-dx:26px} :root[data-dir="back"]{--vt-dx:-26px} :root[data-dir="fade"],:root[data-dir="none"]{--vt-dx:0px}
::view-transition-group(*){animation-duration:.42s; animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(page){animation:vt-out .22s cubic-bezier(.4,0,1,1) both}
::view-transition-new(page){animation:vt-in .42s cubic-bezier(.2,.8,.2,1) both}
::view-transition-old(hero){animation:vt-fade-out .2s ease both}
::view-transition-new(hero){animation:vt-in .45s cubic-bezier(.2,.8,.2,1) both}
::view-transition-old(root),::view-transition-new(root){animation-duration:.25s}
@keyframes vt-out{to{opacity:0; transform:translateX(calc(var(--vt-dx) * -1)) scale(.99)}}
@keyframes vt-in{from{opacity:0; transform:translateX(var(--vt-dx)) translateY(6px) scale(.99)}}
@keyframes vt-fade-out{to{opacity:0}}
#view.enter > *{animation:vt-in .42s cubic-bezier(.2,.8,.2,1) both}
#view.enter-back > *{animation:vt-in-back .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes vt-in-back{from{opacity:0; transform:translateX(-26px) translateY(6px)}}
#view.enter > *:nth-child(2),#view.enter-back > *:nth-child(2){animation-delay:.03s}
#view.enter > *:nth-child(3),#view.enter-back > *:nth-child(3){animation-delay:.06s}
@media (prefers-reduced-motion:reduce){ ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none !important} #view.enter > *,#view.enter-back > *{animation:none} }
/* modal in/out */
.back{animation:bk-in .22s ease both}
.back.closing{animation:bk-out .26s ease both; pointer-events:none}
.back.closing .sheet{animation:sh-out .26s cubic-bezier(.4,0,1,1) both}
.sheet{animation:sh-in .38s cubic-bezier(.2,.9,.2,1) both; will-change:transform}
@keyframes bk-in{from{opacity:0}} @keyframes bk-out{to{opacity:0}}
@keyframes sh-in{from{transform:translateY(60px); opacity:.4}}
@keyframes sh-out{to{transform:translateY(80px); opacity:0}}
@media (min-width:700px){ @keyframes sh-in{from{transform:translateY(16px) scale(.97); opacity:0}} @keyframes sh-out{to{transform:translateY(10px) scale(.97); opacity:0}} }
@media (prefers-reduced-motion:reduce){ .back,.back.closing,.sheet,.back.closing .sheet{animation:none} }
/* compact header on scroll (phone) */
.minibar{position:fixed; top:0; left:0; right:0; z-index:28; display:flex; align-items:center; justify-content:center; height:calc(46px + env(safe-area-inset-top,0px)); padding-top:env(safe-area-inset-top,0px); background:rgba(250,246,239,.78); backdrop-filter:saturate(1.4) blur(18px); -webkit-backdrop-filter:saturate(1.4) blur(18px); border-bottom:1px solid var(--line); font:700 16px var(--f-body); letter-spacing:-.01em; color:var(--text); opacity:0; transform:translateY(-8px); pointer-events:none; transition:opacity .22s ease, transform .22s ease}
.minibar.on{opacity:1; transform:none}
@media (min-width:900px){ .minibar{display:none} }
/* hover lift on laptop */
@media (hover:hover){ .hud.now:hover, .rg:hover, .daybar:hover, .qa:hover{transform:translateY(-1px)} .row:hover{background:rgba(60,44,28,.02)} }

/* token-driven overrides of hardcoded surfaces */
body{background:var(--page) fixed, var(--bg); transition:background-color .3s ease}
body::before{background:radial-gradient(900px 520px at 50% -180px, var(--glow1), transparent 70%), radial-gradient(600px 420px at 100% 20%, var(--glow2), transparent 70%)}
body::after{opacity:var(--noise-op); mix-blend-mode:var(--noise-blend)}
.hud{border-color:rgba(var(--line-rgb),.05)}
.rings, .qa{border-color:rgba(var(--line-rgb),.05)}
.row.done .ttl{text-decoration-color:rgba(var(--line-rgb),.32)}
.banner{background:var(--banner)}
.tabbar{background:var(--glass); border-color:var(--glass-edge); box-shadow:0 18px 40px -8px rgba(var(--sh-rgb),.22), 0 2px 6px rgba(var(--sh-rgb),.06)}
.rail{background:var(--glass-rail)}
.minibar{background:var(--glass-mini)}
.core-tab .mc{background:var(--panel); border-color:var(--glass-edge); box-shadow:0 12px 26px rgba(var(--warm-rgb),.28), 0 0 0 5px var(--glass)}
.mc-orb{background:radial-gradient(circle at 34% 28%, var(--orb1) 0%, var(--orb2) 30%, var(--orb4) 65%, var(--orb5) 100%); box-shadow:inset -3px -5px 10px rgba(var(--warm-rgb),.22), inset 3px 3px 8px rgba(255,255,255,var(--orb-hi))}
.brand i{background:radial-gradient(circle at 35% 30%, var(--orb1), var(--orb4) 60%, var(--orb5))}
.orb{background:radial-gradient(circle at 32% 26%, var(--orb1) 0%, var(--orb2) 20%, var(--orb3) 52%, var(--orb4) 78%, var(--orb5) 100%);
  box-shadow:inset -12px -16px 34px rgba(var(--warm-rgb),.20), inset 10px 12px 26px rgba(255,255,255,var(--orb-hi)), 0 22px 44px rgba(var(--warm-rgb),.20), 0 3px 8px rgba(var(--warm-rgb),.12)}
.core:hover .orb{box-shadow:inset -12px -16px 34px rgba(var(--warm-rgb),.20), inset 10px 12px 26px rgba(255,255,255,var(--orb-hi)), 0 26px 52px rgba(var(--warm-rgb),.26), 0 3px 8px rgba(var(--warm-rgb),.12)}
.core[data-state="done"] .orb{box-shadow:inset -12px -16px 34px rgba(var(--warm-rgb),.2), inset 10px 12px 26px rgba(255,255,255,var(--orb-hi)), 0 0 0 6px rgba(var(--acc-rgb),.08), 0 26px 52px rgba(var(--warm-rgb),.24)}
.orb::before{background:radial-gradient(circle at 72% 80%, var(--orb-tint), transparent 55%), radial-gradient(circle at 20% 75%, rgba(255,255,255,calc(var(--orb-hi) * .37)), transparent 45%)}
.orb-ring .ticks{stroke:rgba(var(--line-rgb),.28)} .orb-ring .ticks5{stroke:rgba(var(--line-rgb),.55)} .orb-ring .trk{stroke:rgba(var(--line-rgb),.07)}
.core[data-state="behind"] .core-center i{color:var(--warn)}
.hello h1 em, .hex b{color:var(--em)}
.lvl-chip .rk{background:var(--rk-bg); color:var(--rk-fg); box-shadow:0 0 0 1.5px rgba(var(--acc-rgb),.25)}
.hex polygon:first-child{fill:rgba(var(--acc-rgb),.06) !important}
.btn{box-shadow:0 1px 2px rgba(var(--sh-rgb),.05)}
.seg button.on, .subnav button.on{box-shadow:0 1px 3px rgba(var(--sh-rgb),.12)}
.inp{background:var(--field)}
.adv, .receipt{background:var(--soft)}
.mus .band{background:rgba(var(--acc-rgb),.08); border-color:rgba(var(--acc-rgb),.35)}
.back{background:var(--back)}
.sheet{background:var(--sheet); box-shadow:0 -10px 40px rgba(var(--sh-rgb),.18)}
.sheet::before{background:rgba(var(--line-rgb),.18)}
.toast, .tip{background:var(--inv); color:rgb(var(--inv-rgb)); box-shadow:0 14px 34px rgba(var(--sh-rgb),.28)}
.toast b, .toast.big b{color:var(--inv-acc)} .toast.bad{background:var(--inv-bad); color:#1A1714}
:root:not([data-mode="dark"]) .toast.bad{color:#FFFDF9}
.rest{background:var(--inv); color:rgb(var(--inv-rgb)); box-shadow:0 14px 34px rgba(var(--sh-rgb),.35)}
.rest .mono{color:rgba(var(--inv-rgb),.6) !important} .rest .t{color:rgb(var(--inv-rgb))}
.rest .track{background:rgba(var(--inv-rgb),.15)}
.rest .btn{background:rgba(var(--inv-rgb),.1); border-color:rgba(var(--inv-rgb),.18); color:rgb(var(--inv-rgb))}
@media (hover:hover){ .row:hover{background:rgba(var(--line-rgb),.025)} }
:root[data-mode="dark"] .btn.pri{background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(0,0,0,.04)), var(--acc)}
:root[data-mode="dark"] .chk.on{background:var(--acc)}
:root[data-mode="dark"] img{opacity:.92}
/* theme switch fade */
:root.theme-fade, :root.theme-fade *{transition:background-color .35s ease, color .35s ease, border-color .35s ease, fill .35s ease, stroke .35s ease !important}
/* palette picker */
.pals{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}

й.":"Press up in an arc, don't clank the dumbbells together at the top.","Наклон скамьи 30–45°.":"Bench incline 30–45°.","Опускай гантели к верху груди, локти чуть ниже уровня плеч.":"Lower the dumbbells to your upper chest, elbows slightly below shoulder level.","Выжимай вверх, сохраняя сведённые лопатки.":"Press up, keeping your shoulder blades together.","Руки чуть согнуты в локтях, угол не меняется всё движение.":"Elbows slightly bent, keep the angle fixed throughout the movement.","Разводи до растяжения груди, без боли в плечах.":"Open your arms until you feel a stretch in your chest, with no shoulder pain.","Своди по дуге, будто обнимаешь бочку. Вес небольшой.":"Bring them together in an arc, as if hugging a barrel. Keep the weight light.","Корпус слегка наклонён вперёд — так работает грудь.":"Lean your torso slightly forward — that's what works the chest.","Опускайся, пока плечо примерно не станет параллельно полу, без боли в плечах.":"Lower until your upper arms are roughly parallel to the floor, with no shoulder pain.","Выжимай себя без раскачки. Когда 12+ повторов даются легко — вешай вес на пояс.":"Press yourself up without swinging. Once 12+ reps feel easy, add weight on a dip belt.","Тело — прямая линия от пяток до головы, пресс напряжён.":"Body in a straight line from heels to head, abs tight.","Руки чуть шире плеч, локти около 45° к корпусу.":"Hands slightly wider than your shoulders, elbows about 45° to your torso.","Опускайся почти до касания пола грудью и выжимай вверх полностью.":"Lower until your chest almost touches the floor, then push all the way up.","Шаг вперёд, лёгкий наклон корпуса, руки чуть согнуты.":"Step forward, lean slightly, arms slightly bent.","Своди рукояти перед собой по дуге, в конце сожми грудь на секунду.":"Bring the handles together in front of you in an arc, squeeze your chest for a second at the end.","Возвращай медленно, не давая весу дёргать плечи.":"Return slowly, don't let the weight yank your shoulders.","Хват чуть шире плеч. Начни движение с опускания плеч вниз.":"Grip slightly wider than your shoulders. Start the movement by pulling your shoulders down.","Тянись грудью к перекладине, локти ведёшь вниз и к корпусу.":"Pull your chest toward the bar, driving your elbows down and in to your sides.","Опускайся полностью и подконтрольно, без рывков и раскачки.":"Lower all the way under control, no jerking or swinging.","Наклон корпуса 30–45°, спина прямая, колени слегка согнуты.":"Torso tilted 30–45°, back straight, knees slightly bent.","Тяни гриф к низу живота, локти идут вдоль корпуса.":"Pull the bar to your lower belly, elbows close to your body.","Вверху сведи лопатки, опускай подконтрольно. Если тянет поясницу — снизь вес.":"Squeeze your shoulder blades at the top, lower under control. If your lower back strains, reduce the weight.","Сядь плотно, бёдра зафиксированы валиками.":"Sit down firmly with your thighs locked under the pads.","Тяни рукоять к верху груди, слегка отклонившись назад, локти вниз.":"Pull the bar to your upper chest, leaning back slightly, elbows down.","Не тяни за голову и не раскачивайся корпусом.":"Don't pull behind your head or swing your torso.","Колено и рука на скамье, спина прямая и параллельна полу.":"Knee and hand on the bench, back straight and parallel to the floor.","Тяни гантель к поясу, локоть идёт вдоль корпуса.":"Pull the dumbbell to your hip, elbow close to your body.","Опускай до растяжения спины, корпус не скручивай.":"Lower until your back stretches, don't twist your torso.","Спина прямая, ноги слегка согнуты.":"Back straight, knees slightly bent.","Тяни рукоять к животу, в конце сведи лопатки.":"Pull the handle to your belly, squeeze your shoulder blades at the end.","Не откидывайся назад, возвращай вес медленно.":"Don't lean back, return the weight slowly.","Гриф над серединой стопы, спина нейтральная, плечи чуть впереди грифа.":"Bar over mid-foot, neutral spine, shoulders slightly in front of the bar.","Толкай пол ногами, гриф скользит вдоль ног, спина не округляется.":"Push the floor away with your legs, the bar slides along your legs, don't round your back.","Вверху выпрямись без переразгибания. Технику лучше поставить с тренером и начать с лёгкого веса.":"Stand tall at the top without leaning back. Best to learn the form with a coach and start light.","Валик под тазом, корпус свободно опускается вниз.":"Pad under your hips, torso hanging down freely.","Поднимайся до прямой линии тела, поясницу не переразгибай.":"Rise until your body forms a straight line, don't overarch your lower back.","Темп медленный. Когда 15+ повторов легко — возьми блин к груди.":"Slow tempo. Once 15+ reps feel easy, hold a plate to your chest.","Хват чуть шире плеч, ягодицы и пресс напряжены.":"Grip slightly wider than your shoulders, glutes and abs tight.","Выжимай гриф вертикально вверх: голову убираешь назад и возвращаешь под гриф.":"Press the bar straight up: move your head back, then bring it under the bar.","Не прогибайся в пояснице — если прогиб появился, вес слишком большой.":"Don't arch your lower back — if you do, the weight is too heavy.","Спинка скамьи почти вертикальна, спина прижата.":"Bench back almost upright, back pressed against it.","Гантели у плеч, локти немного впереди корпуса.":"Dumbbells at your shoulders, elbows slightly in front of your torso.","Выжимай вверх без удара гантелей, опускай до уровня ушей.":"Press up without clanking the dumbbells, lower to ear level.","Лёгкий наклон вперёд, руки чуть согнуты.":"Lean slightly forward, arms slightly bent.","Поднимай гантели через стороны до уровня плеч, движение ведёт локоть.":"Raise the dumbbells out to the sides to shoulder height, leading with your elbows.","Без раскачки корпусом. Вес маленький — работает мышца, а не инерция.":"No swinging. Keep the weight light — the muscle does the work, not momentum.","Канат на уровне лица, хват сверху.":"Rope at face height, overhand grip.","Тяни к лицу, разводя концы каната, локти высоко.":"Pull toward your face, spreading the rope ends apart, elbows high.","В конце сведи лопатки и разверни плечи наружу.":"At the end, squeeze your shoulder blades and rotate your shoulders out.","Наклон почти параллельно полу, спина прямая.":"Bend over almost parallel to the floor, back straight.","Разводи руки в стороны, локти чуть согнуты.":"Raise your arms out to the sides, elbows slightly bent.","Сжимай заднюю дельту вверху, без рывков.":"Squeeze your rear delts at the top, no jerking.","Локти прижаты к корпусу и не уходят вперёд.":"Elbows pinned to your sides, don't let them drift forward.","Поднимай гриф силой бицепса, без раскачки спиной.":"Curl the bar with your biceps, no swinging your back.","Опускай медленно, почти до прямых рук.":"Lower slowly until your arms are almost straight.","Нейтральный хват: ладони смотрят друг на друга.":"Neutral grip: palms facing each other.","Локти неподвижны у корпуса.":"Elbows fixed at your sides.","Поднимай до плеча и медленно опускай.":"Curl up to your shoulder and lower slowly.","По ходу подъёма разворачивай ладонь вверх.":"Rotate your palm up as you curl.","Локти не двигаются, корпус неподвижен.":"Elbows don't move, torso stays still.","Опускай гантели подконтрольно.":"Lower the dumbbells under control.","Стой близко к блоку, локти прижаты.":"Stand close to the cable, elbows tucked in.","Сгибай руки до пикового сокращения.":"Curl to a full peak contraction.","Возвращай медленно, не отпуская натяжение.":"Return slowly, keeping tension on the muscle.","Лёжа, гриф над лбом, плечи слегка наклонены к голове.":"Lying down, bar over your forehead, upper arms angled slightly toward your head.","Сгибай руки только в локтях, опуская гриф ко лбу или чуть за голову.":"Bend only at the elbows, lowering the bar to your forehead or just behind your head.","Локти не разводи. Начни с лёгкого веса — упражнение нагружает локти.":"Don't flare your elbows. Start light — this one is hard on the elbows.","Локти прижаты к бокам и неподвижны.":"Elbows pinned to your sides and still.","Разгибай руки до конца, сжимая трицепс.":"Extend your arms fully, squeezing your triceps.","Возвращай до угла около 90°, локти не поднимай.":"Come back up to about 90°, don't let your elbows rise.","Хват на ширине плеч, не уже.":"Shoulder-width grip, no narrower.","Опускай гриф к низу груди, локти идут вдоль корпуса.":"Lower the bar to your lower chest, elbows close to your body.","Выжимай за счёт трицепса, лопатки сведены.":"Press with your triceps, shoulder blades together.","Руки на скамье за спиной, пальцы смотрят вперёд.":"Hands on the bench behind you, fingers pointing forward.","Опускайся до угла в локтях около 90°, плечи вниз.":"Lower until your elbows are at about 90°, shoulders down.","Если болят плечи — уменьши глубину или замени упражнение.":"If your shoulders hurt, go less deep or swap the exercise.","Гриф на трапециях, стопы на ширине плеч, носки слегка врозь.":"Bar on your traps, feet shoulder-width apart, toes slightly out.","Садись назад и вниз, колени идут по линии носков, спина нейтральная.":"Sit back and down, knees tracking over your toes, neutral spine.","Глубина — до параллели бедра с полом, если спина не округляется. Вставай, толкая пол всей стопой.":"Go down until your thighs are parallel to the floor, as long as your back doesn't round. Stand up by pushing through your whole foot.","Поясница прижата к спинке всё время.":"Keep your lower back pressed against the pad the whole time.","Стопы на ширине плеч посередине платформы.":"Feet shoulder-width apart in the middle of the platform.","Опускай до угла около 90° в коленях. Колени наверху до щелчка не выпрямляй.":"Lower until your knees are at about 90°. Don't lock out your knees at the top.","Колени слегка согнуты и почти не меняют угол.":"Knees slightly bent, their angle barely changes.","Отводи таз назад, гриф скользит по бёдрам, спина прямая.":"Push your hips back, bar sliding down your thighs, back straight.","Опускай до растяжения задней поверхности бедра и возвращай и грудь на секунду.":"Зводь рукояті перед собою по дузі, наприкінці стисни груди на секунду.","Возвращай медленно, не давая весу дёргать плечи.":"Повертай повільно, не даючи вазі смикати плечі.","Хват чуть шире плеч. Начни движение с опускания плеч вниз.":"Хват трохи ширший за плечі. Почни рух з опускання плечей униз.","Тянись грудью к перекладине, локти ведёшь вниз и к корпусу.":"Тягнися грудьми до перекладини, лікті ведеш униз і до корпусу.","Опускайся полностью и подконтрольно, без рывков и раскачки.":"Опускайся повністю й підконтрольно, без ривків і розгойдування.","Наклон корпуса 30–45°, спина прямая, колени слегка согнуты.":"Нахил корпусу 30–45°, спина пряма, коліна злегка зігнуті.","Тяни гриф к низу живота, локти идут вдоль корпуса.":"Тягни гриф до низу живота, лікті йдуть уздовж корпусу.","Вверху сведи лопатки, опускай подконтрольно. Если тянет поясницу — снизь вес.":"Угорі зведи лопатки, опускай підконтрольно. Якщо тягне поперек — зменш вагу.","Сядь плотно, бёдра зафиксированы валиками.":"Сядь щільно, стегна зафіксовані валиками.","Тяни рукоять к верху груди, слегка отклонившись назад, локти вниз.":"Тягни рукоять до верху грудей, злегка відхилившись назад, лікті вниз.","Не тяни за голову и не раскачивайся корпусом.":"Не тягни за голову й не розгойдуйся корпусом.","Колено и рука на скамье, спина прямая и параллельна полу.":"Коліно й рука на лаві, спина пряма й паралельна підлозі.","Тяни гантель к поясу, локоть идёт вдоль корпуса.":"Тягни гантель до пояса, лікоть іде вздовж корпусу.","Опускай до растяжения спины, корпус не скручивай.":"Опускай до розтягнення спини, корпус не скручуй.","Спина прямая, ноги слегка согнуты.":"Спина пряма, ноги злегка зігнуті.","Тяни рукоять к животу, в конце сведи лопатки.":"Тягни рукоять до живота, наприкінці зведи лопатки.","Не откидывайся назад, возвращай вес медленно.":"Не відкидайся назад, повертай вагу повільно.","Гриф над серединой стопы, спина нейтральная, плечи чуть впереди грифа.":"Гриф над серединою стопи, спина нейтральна, плечі трохи попереду грифа.","Толкай пол ногами, гриф скользит вдоль ног, спина не округляется.":"Відштовхуй підлогу ногами, гриф ковзає вздовж ніг, спина не округлюється.","Вверху выпрямись без переразгибания. Технику лучше поставить с тренером и начать с лёгкого веса.":"Угорі випрямися без переразгинання. Техніку краще поставити з тренером і почати з легкої ваги.","Валик под тазом, корпус свободно опускается вниз.":"Валик під тазом, корпус вільно опускається вниз.","Поднимайся до прямой линии тела, поясницу не переразгибай.":"Піднімайся до прямої лінії тіла, поперек не переразгинай.","Темп медленный. Когда 15+ повторов легко — возьми блин к груди.":"Темп повільний. Коли 15+ повторів легко — візьми млинець до грудей.","Хват чуть шире плеч, ягодицы и пресс напряжены.":"Хват трохи ширший за плечі, сідниці й прес напружені.","Выжимай гриф вертикально вверх: голову убираешь назад и возвращаешь под гриф.":"Вижимай гриф вертикально вгору: голову відводиш назад і повертаєш під гриф.","Не прогибайся в пояснице — если прогиб появился, вес слишком большой.":"Не прогинайся в попереку — якщо з’явився прогин, вага завелика.","Спинка скамьи почти вертикальна, спина прижата.":"Спинка лави майже вертикальна, спина притиснута.","Гантели у плеч, локти немного впереди корпуса.":"Гантелі біля плечей, лікті трохи попереду корпусу.","Выжимай вверх без удара гантелей, опускай до уровня ушей.":"Вижимай угору, не стукаючи гантелями, опускай до рівня вух.","Лёгкий наклон вперёд, руки чуть согнуты.":"Легкий нахил уперед, руки трохи зігнуті.","Поднимай гантели через стороны до уровня плеч, движение ведёт локоть.":"Піднімай гантелі через сторони до рівня плечей, рух веде лікоть.","Без раскачки корпусом. Вес маленький — работает мышца, а не инерция.":"Без розгойдування корпусом. Вага мала — працює м’яз, а не інерція.","Канат на уровне лица, хват сверху.":"Канат на рівні обличчя, хват зверху.","Тяни к лицу, разводя концы каната, локти высоко.":"Тягни до обличчя, розводячи кінці каната, лікті високо.","В конце сведи лопатки и разверни плечи наружу.":"Наприкінці зведи лопатки й розверни плечі назовні.","Наклон почти параллельно полу, спина прямая.":"Нахил майже паралельно підлозі, спина пряма.","Разводи руки в стороны, локти чуть согнуты.":"Розводь руки в сторони, лікті трохи зігнуті.","Сжимай заднюю дельту вверху, без рывков.":"Стискай задню дельту вгорі, без ривків.","Локти прижаты к корпусу и не уходят вперёд.":"Лікті притиснуті до корпусу й не йдуть уперед.","Поднимай гриф силой бицепса, без раскачки спиной.":"Піднімай гриф силою біцепса, без розгойдування спиною.","Опускай медленно, почти до прямых рук.":"Опускай повільно, майже до прямих рук.","Нейтральный хват: ладони смотрят друг на друга.":"Нейтральний хват: долоні дивляться одна на одну.","Локти неподвижны у корпуса.":"Лікті нерухомі біля корпусу.","Поднимай до плеча и медленно опускай.":"Піднімай до плеча й повільно опускай.","По ходу подъёма разворачивай ладонь вверх.":"Під час підйому розвертай долоню вгору.","Локти не двигаются, корпус неподвижен.":"Лікті не рухаються, корпус нерухомий.","Опускай гантели подконтрольно.":"Опускай гантелі підконтрольно.","Стой близко к блоку, локти прижаты.":"Стій близько до блока, лікті притиснуті.","Сгибай руки до пикового сокращения.":"Згинай руки до пікового скорочення.","Возвращай медленно, не отпуская натяжение.":"Повертай повільно, не знімаючи натягу.","Лёжа, гриф над лбом, плечи слегка наклонены к голове.":"Лежачи, гриф над лобом, плечі злегка нахилені до голови.","Сгибай руки только в локтях, опуская гриф ко лбу или чуть за голову.":"Згинай руки лише в ліктях, опускаючи гриф до лоба або трохи за голову.","Локти не разводи. Начни с лёгкого веса — упражнение нагружает локти.":"Лікті не розводь. Почни з легкої ваги — вправа навантажує лікті.","Локти прижаты к бокам и неподвижны.":"Лікті притиснуті до боків і нерухомі.","Разгибай руки до конца, сжимая трицепс.":"Розгинай руки до кінця, стискаючи трицепс.","Возвращай до угла около 90°, локти не поднимай.":"Повертай до кута близько 90°, лікті не піднімай.","Хват на ширине плеч, не уже.":"Хват на ширині плечей, не вужче.","Опускай гриф к низу груди, локти идут вдоль корпуса.":"Опускай гриф до низу грудей, лікті йдуть уздовж корпусу.","Выжимай за счёт трицепса, лопатки сведены.":"Вижимай за рахунок трицепса, лопатки зведені.","Руки на скамье за спиной, пальцы смотрят вперёд.":"Руки на лаві за спиною, пальці дивляться вперед.","Опускайся до угла в локтях около 90°, плечи вниз.":"Опускайся до кута в ліктях близько 90°, плечі вниз.","Если болят плечи — уменьши глубину или замени упражнение.":"Якщо болять плечі — зменш глибину або заміни вправу.","Гриф на трапециях, стопы на ширине плеч, носки слегка врозь.":"Гриф на трапеціях, стопи на ширині плечей, носки трохи розведені.","Садись назад и вниз, колени идут по линии носков, спина нейтральная.":"Сідай назад і вниз, коліна йдуть по лінії носків, спина нейтральна.","Глубина — до параллели бедра с полом, если спина не округляется. Вставай, толкая пол всей стопой.":"Глибина — до паралелі стегна з підлогою, якщо спина не округлюється. Вставай, відштовхуючись від підлоги всією стопою.","Поясница прижата к спинке всё время.":"Поперек увесь час притиснутий до спинки.","Стопы на ширине плеч посередине платформы.":"Стопи на ширині плечей посередині платформи.","Опускай до угла около 90° в коленях. Колени наверху до щелчка не выпрямляй.":"Опускай до кута близько 90° у колінах. Коліна вгорі до клацання не випрямляй.","Колени слегка согнуты и почти не меняют угол.":"Коліна злегка зігнуті й майже не змінюють кут.","Отводи таз назад, гриф скользит по бёдрам, спина прямая.":"Відводь таз назад, гриф ковзає по стегнах, спина пряма.","Опускай до растяжения задней поверхности бедра и возвращайся движением таза вперёд.":"Опускай до розтягнення задньої поверхні стегна й повертайся рухом таза вперед.","Шаг достаточно длинный, корпус вертикально.":"Крок досить довгий, корпус вертикально.","Опускайся, пока заднее колено почти не коснётся пола.":"Опускайся, доки заднє коліно майже не торкнеться підлоги.","Толкайся пяткой передней ноги, колено не заваливается внутрь.":"Відштовхуйся п’ятою передньої ноги, коліно не завалюється всередину.","Валик на нижней части голени, колени на оси тренажёра.":"Валик на нижній частині гомілки, коліна на осі тренажера.","Разгибай почти до прямых ног, наверху задержка на секунду.":"Розгинай майже до прямих ніг, угорі затримка на секунду.","Опускай медленно, без рывков.":"Опускай повільно, без ривків.","Валик над пятками, таз прижат.":"Валик над п’ятами, таз притиснутий.","Сгибай ноги до упора, таз не отрывай.":"Згинай ноги до упору, таз не відривай.","Опускай медленно.":"Опускай повільно.","Опусти пятки ниже опоры, чтобы растянуть икры.":"Опусти п’яти нижче опори, щоб розтягнути литки.","Поднимайся на носки максимально высоко, пауза вверху.":"Піднімайся на носки якомога вище, пауза вгорі.","Колени почти прямые, темп медленный.":"Коліна майже прямі, темп повільний.","Лопатки на скамье, штанга на тазе через мягкую подушку.":"Лопатки на лаві, штанга на тазі через м’яку подушку.","Поставь стопы так, чтобы вверху голени были вертикальны.":"Постав стопи так, щоб угорі гомілки були вертикальні.","Поднимай таз до прямой линии, сжимая ягодицы, без прогиба в пояснице.":"Піднімай таз до прямої лінії, стискаючи сідниці, без прогину в попереку.","Задняя нога на скамье, передняя стоит достаточно далеко.":"Задня нога на лаві, передня стоїть досить далеко.","Опускайся вертикально вниз, корпус чуть вперёд.":"Опускайся вертикально вниз, корпус трохи вперед.","Толкайся пяткой передней ноги, колено по линии носка.":"Відштовхуйся п’ятою передньої ноги, коліно по лінії носка.","Манжета на щиколотке, держись за стойку.":"Манжета на щиколотці, тримайся за стійку.","Отводи ногу назад без прогиба в пояснице.":"Відводь ногу назад без прогину в попереку.","Сожми ягодицу в крайней точке, возвращай медленно.":"Стисни сідницю в крайній точці, повертай повільно.","Поясница прижата к полу.":"Поперек притиснут рогиб в пояснице, стопы упираются в пол.":"Escápulas juntas y pegadas al banco, ligero arco lumbar, pies firmes en el suelo.","Хват чуть шире плеч. Опускай гриф к низу груди, локти примерно под 45° к корпусу.":"Agarre algo más ancho que los hombros. Baja la barra a la parte baja del pecho, codos a unos 45° del torso.","Выжимай вверх и немного к лицу, таз не отрывай. Тяжёлые подходы — со страхующим.":"Empuja hacia arriba y un poco hacia la cara, sin despegar la cadera. Las series pesadas, con alguien que te asista.","Лопатки сведены, гантели над грудью, запястья ровные.":"Escápulas juntas, mancuernas sobre el pecho, muñecas rectas.","Опускай до лёгкого растяжения груди, локти около 45° к корпусу.":"Baja hasta notar un ligero estiramiento del pecho, codos a unos 45° del torso.","Выжимай по дуге вверх, гантели наверху не стукай.":"Empuja en arco hacia arriba, sin chocar las mancuernas arriba.","Наклон скамьи 30–45°.":"Banco inclinado a 30–45°.","Опускай гантели к верху груди, локти чуть ниже уровня плеч.":"Baja las mancuernas a la parte alta del pecho, codos algo por debajo de los hombros.","Выжимай вверх, сохраняя сведённые лопатки.":"Empuja hacia arriba manteniendo las escápulas juntas.","Руки чуть согнуты в локтях, угол не меняется всё движение.":"Codos ligeramente flexionados, con el mismo ángulo durante todo el movimiento.","Разводи до растяжения груди, без боли в плечах.":"Abre hasta notar el estiramiento del pecho, sin dolor en los hombros.","Своди по дуге, будто обнимаешь бочку. Вес небольшой.":"Cierra en arco, como si abrazaras un barril. Peso moderado.","Корпус слегка наклонён вперёд — так работает грудь.":"Torso algo inclinado hacia delante — así trabaja el pecho.","Опускайся, пока плечо примерно не станет параллельно полу, без боли в плечах.":"Baja hasta que el brazo quede más o menos paralelo al suelo, sin dolor en los hombros.","Выжимай себя без раскачки. Когда 12+ повторов даются легко — вешай вес на пояс.":"Empuja sin balancearte. Cuando hagas 12+ reps  detrás de la cabeza ni balancees el torso.","Колено и рука на скамье, спина прямая и параллельна полу.":"Rodilla y mano en el banco, espalda recta y paralela al suelo.","Тяни гантель к поясу, локоть идёт вдоль корпуса.":"Tira de la mancuerna hacia la cadera, con el codo pegado al torso.","Опускай до растяжения спины, корпус не скручивай.":"Baja hasta notar el estiramiento de la espalda, sin girar el torso.","Спина прямая, ноги слегка согнуты.":"Espalda recta, piernas ligeramente flexionadas.","Тяни рукоять к животу, в конце сведи лопатки.":"Tira del agarre hacia el abdomen y junta las escápulas al final.","Не откидывайся назад, возвращай вес медленно.":"No te eches hacia atrás; devuelve el peso despacio.","Гриф над серединой стопы, спина нейтральная, плечи чуть впереди грифа.":"Barra sobre el medio del pie, espalda neutra, hombros un poco por delante de la barra.","Толкай пол ногами, гриф скользит вдоль ног, спина не округляется.":"Empuja el suelo con las piernas, la barra sube pegada a las piernas, la espalda no se redondea.","Вверху выпрямись без переразгибания. Технику лучше поставить с тренером и начать с лёгкого веса.":"Arriba, estírate sin hiperextender. Mejor aprender la técnica con un entrenador y empezar con poco peso.","Валик под тазом, корпус свободно опускается вниз.":"Rodillo bajo la cadera, el torso baja libremente.","Поднимайся до прямой линии тела, поясницу не переразгибай.":"Sube hasta que el cuerpo quede en línea recta, sin hiperextender la zona lumbar.","Темп медленный. Когда 15+ повторов легко — возьми блин к груди.":"Ritmo lento. Cuando 15+ reps te resulten fáciles, sujeta un disco contra el pecho.","Хват чуть шире плеч, ягодицы и пресс напряжены.":"Agarre algo más ancho que los hombros, glúteos y abdomen apretados.","Выжимай гриф вертикально вверх: голову убираешь назад и возвращаешь под гриф.":"Empuja la barra en vertical: aparta la cabeza hacia atrás y vuelve a meterla bajo la barra.","Не прогибайся в пояснице — если прогиб появился, вес слишком большой.":"No arquees la zona lumbar — si aparece el arco, el peso es excesivo.","Спинка скамьи почти вертикальна, спина прижата.":"Respaldo del banco casi vertical, espalda apoyada.","Гантели у плеч, локти немного впереди корпуса.":"Mancuernas a la altura de los hombros, codos un poco por delante del torso.","Выжимай вверх без удара гантелей, опускай до уровня ушей.":"Empuja hacia arriba sin chocar las mancuernas y baja hasta la altura de las orejas.","Лёгкий наклон вперёд, руки чуть согнуты.":"Ligera inclinación hacia delante, brazos algo flexionados.","Поднимай гантели через стороны до уровня плеч, движение ведёт локоть.":"Sube las mancuernas por los lados hasta la altura de los hombros, guiando con el codo.","Без раскачки корпусом. Вес маленький — работает мышца, а не инерция.":"Sin balancear el torso. Peso ligero — que trabaje el músculo, no la inercia.","Канат на уровне лица, хват сверху.":"Cuerda a la altura de la cara, agarre prono.","Тяни к лицу, разводя концы каната, локти высоко.":"Tira hacia la cara separando los extremos de la cuerda, codos altos.","В конце сведи лопатки и разверни плечи наружу.":"Al final junta las escápulas y rota los hombros hacia fuera.","Наклон почти параллельно полу, спина прямая.":"Inclínate casi en paralelo al suelo, espalda recta.","Разводи руки в стороны, локти чуть согнуты.":"Abre los brazos hacia los lados, codos algo flexionados.","Сжимай заднюю дельту вверху, без рывков.":"Aprieta el deltoides posterior arriba, sin tirones.","Локти прижаты к корпусу и не уходят вперёд.":"Codos pegados al torso, sin irse hacia delante.","Поднимай гриф силой бицепса, без раскачки спиной.":"Sube la barra con la fuerza del bíceps, sin balancear la espalda.","Опускай медленно, почти до прямых рук.":"Baja despacio, hasta tener los brazos casi rectos.","Нейтральный хват: ладони смотрят друг на друга.":"Agarre neutro: palmas enfrentadas.","Локти неподвижны у корпуса.":"Codos quietos junto al torso.","Поднимай до плеча и медленно опускай.":"Su function enqueue(path, fn){ const p=(queues[path]||Promise.resolve()).then(fn).catch(onWriteErr); queues[path]=p; return p; }
function onWriteErr(e){
  console.warn('write failed', e);
  const c = e && e.code;
  if(c==='invalid_argument') toast('Не получилось сохранить: у этого просмотра нет прав на запись.','bad');
  else if(c==='quota_exceeded') toast('База заполнена. Удали старые записи из истории.','bad');
  else if(c==='revoked'||c==='not_granted') toast('Доступ к данным отозван. Обнови страницу.','bad');
  else toast('Изменение не сохранилось. Проверь интернет и повтори.','bad');

function persistLocal(){ if(S.mode!=='local') return; const o={}; COLS.forEach(c=>{ o[c]=Object.fromEntries([...S.cols[c]].map(([k,v])=>[k,strip(v)])); }); lsSet(LS_KEY, JSON.stringify(o)); }
const Store = {
  set(col,id,data){
    jrec(col,id); trackW(col);
    const body=strip(data); applyLocal(col,id,body); changed();
    if(S.mode==='live'){ const path=col+'/'+id; known.add(path); return enqueue(path, ()=>db.doc(path).set(body)); }
    persistLocal(); return Promise.resolve();
  },
  merge(col,id,patch){
    jrec(col,id); trackW(col);
    patch=clone(patch); const cur=S.cols[col].get(id);
    applyLocal(col,id, deepMerge(cur ? strip(cur) : {}, patch)); changed();
    if(S.mode==='live'){
      const path=col+'/'+id; const existed = !!cur || known.has(path); known.add(path);
      const full = strip(S.cols[col].get(id));
      return enqueue(path, ()=> existed ? db.doc(path).update(patch) : db.doc(path).set(full));
    }
    persistLocal(); return Promise.resolve();
  },
  del(col,id){
    jrec(col,id); trackW(col);
    applyLocal(col,id,null); changed();
    if(S.mode==='live'){ const path=col+'/'+id; known.delete(path); return enqueue(path, ()=>db.doc(path).delete()); }
    persistLocal(); return Promise.resolve();
  }
};

/* ================= domain helpers ================= */
function scheduled(h,d){ const days=(h.days&&h.days.length)?h.days.map(Number):ALLD; return days.includes(wdOf(d)) && d >= (h.since||'0000'); }
function skipped(h,d){ return !!((logOf(d).sk||{})[h.id]); }
function hv(h,d){ let v=Number((logOf(d).h||{})[h.id]||0); if(h.link==='gym' && D.woDates.has(d)) v=Math.max(v,1); return v; }
function isDone(h,d){ const v=hv(h,d); return h.bad ? v===0 : v >= (h.target||1); }
function medScheduled(m,d){ const days=(m.days&&m.days.length)?m.days.map(Number):ALLD; return days.includes(wdOf(d)) && d >= (m.since||'0000'); }
function dosesOn(d){ const l=logOf(d).m||{}; const r=[]; for(const m of medsAll()){ if(!medScheduled(m,d)) continue; for(const tm of (m.times||[])){ const key=m.id+'@'+tm; r.push({key, med:m, time:tm, taken:!!l[key]}); } } return r.sort((a,b)=>a.time.localeCompare(b.time)); }
function taskSort(a,b){ const ta=a.time||'99', tb=b.time||'99'; return (Number(!!a.done)-Number(!!b.done)) || (ta<tb?-1:ta>tb?1:0) || ((b.prio|0)-(a.prio|0)) || String(a.createdAt||'').localeCompare(String(b.createdAt||'')); }
const tasksOn = d => (D.tbd.get(d)||[]).slice().sort(taskSort);
function overdue(){ const t=todayStr(), r=[]; for(const [d,arr] of D.tbd) if(d<t) for(const x of arr) if(!x.done) r.push(x); return r.sort((a,b)=>a.date.localeCompare(b.date)); }
function dayStats(d){
  if(D.dayCache.has(d)) return D.dayCache.get(d);
  let total=0, done=0;
  for(const h of habitsAll()) if(scheduled(h,d) && !skipped(h,d)){ if(h.bad){ if(hv(h,d)>0) total++; continue; } total++; if(isDone(h,d)) done++; }
  for(const x of dosesOn(d)){ total++; if(x.taken) done++; }
  for(const x of (D.tbd.get(d)||[])){ total++; if(x.done) done++; }
  const r={total, done, pct: total ? Math.round(done/total*100) : null};
  D.dayCache.set(d,r); return r;
}
function streakOf(h){
  const t=todayStr(); let d=t, s=0;
  if(!h.bad && scheduled(h,t) && !skipped(h,t) && !isDone(h,t)) d=addDays(t,-1);
  for(let i=0;i<1200;i++){ if(d < (h.since||t)) break; if(scheduled(h,d) && !skipped(h,d)){ if(isDone(h,d)) s++; else break; } d=addDays(d,-1); }
  return s;
}
function bestStreakOf(h){
  const t=todayStr(); let best=0, run=0, free=null, d=h.since||t;
  for(let i=0;i<1200 && d<=t;i++){ if(scheduled(h,d) && !skipped(h,d)){ if(isDone(h,d)){ run++; best=Math.max(best,run); } else if(d===t && !h.bad){} else if(!h.bad && run>0 && (free===null || diffDays(free,d)>=7)){ free=d; } else { run=0; free=null; } } d=addDays(d,1); }
  return best;
}
function progText(h,d){ const v=hv(h,d); if(h.bad) return v ? v+' '+plural(v,'срыв','срыва','срывов') : 'без срывов'; if(h.kind==='count') return `${_L('{0} из {1} {2}', v, h.target, h.unit||'')}`.trim(); if(h.kind==='time') return `${_L('{0} из {1} мин', v, h.target)}`; return v ? 'сделано' : 'не отмечено'; }
function kindLabel(h){ if(h.link==='gym') return _L('отмечается тренировкой'); if(h.bad) return _L('вредная · считаем срывы'); if(h.kind==='count') return `${_L('цель {0} {1}', h.target, h.unit||'')}`.trim(); if(h.kind==='time') return `${_L('цель {0} мин', h.target)}`; return daysText(h.days); }
function planDayFor(d){ return PLAN().days.find(x=>(x.wd||[]).map(Number).includes(wdOf(d))) || null; }
