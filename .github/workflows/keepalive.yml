name: Не засыпать
# GitHub pauses scheduled workflows in public repos after 60 days without commits.
on:
  schedule:
    - cron: '17 4 1,21 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          date -u +%F > push/.alive
          git config user.name "shtab-bot"
          git config user.email "shtab-bot@users.noreply.github.com"
          git add push/.alive
          git commit -m "keepalive" || exit 0
          git push
